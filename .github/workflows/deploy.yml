# AL Waqiah auto-deploy: push to main -> pull, build, restart PM2 (port 3001)
name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          command_timeout: 30m
          script: |
            cd /var/www/alwaqiah
            git pull origin main
            npm install
            npm run build
            pm2 restart alwaqiah --update-env

